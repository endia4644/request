<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="청소용품">
<title>청소용품 요청</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #111827; --sub: #6b7280; --faint: #9ca3af;
  --line: #e5e7eb; --field: #f9fafb; --accent: #2563eb; --accent-ink: #ffffff; --accent-soft: #e8f0fe;
  --req: #b45309; --req-bg: #fef3c7; --ord: #1d4ed8; --ord-bg: #dbeafe; --done: #047857; --done-bg: #d1fae5;
  --danger: #dc2626; --new: #db2777; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 1px 8px rgba(0,0,0,.04);
  --coupang: #e52528;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0d10; --card: #16191e; --ink: #f3f4f6; --sub: #9ca3af; --faint: #6b7280;
    --line: #262a31; --field: #1d2127; --accent: #4f8cff; --accent-ink: #ffffff; --accent-soft: #1b2a45;
    --req: #fbbf24; --req-bg: #3a2c0c; --ord: #93c5fd; --ord-bg: #172a4a; --done: #6ee7b7; --done-bg: #0f2f25;
    --danger: #f87171; --new: #f472b6; --shadow: none; --coupang: #ff5a5d;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

/* 머리 */
header {
  position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  padding-top: env(safe-area-inset-top);
}
header .wrap { display: flex; align-items: center; gap: 10px; height: 56px; }
header h1 { font-size: 20px; margin: 0; letter-spacing: -0.02em; flex: 1; }
.sync { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--done); display: inline-block; }
.sync.busy i { background: var(--accent); animation: pulse 1s infinite; }
.sync.err i { background: var(--danger); }
@keyframes pulse { 50% { opacity: .3; } }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--sub); }
.iconbtn:active { background: var(--line); }

/* 카드 */
.card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); }
.add { padding: 16px; margin-top: 4px; }
.lbl { display: block; font-size: 13px; color: var(--sub); margin: 0 0 6px 2px; font-weight: 600; }
.field {
  width: 100%; height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--field);
  padding: 0 14px; font-size: 16px; outline: none;
}
textarea.field { height: 72px; padding: 12px 14px; resize: none; }
.field:focus { border-color: var(--accent); background: var(--card); }
.name-field { font-size: 18px; font-weight: 600; height: 56px; }
.row { margin-top: 14px; }
.cpreview { margin: 8px 2px 0; font-size: 13px; }
.cpreview:empty { display: none; }
.cpreview a { color: var(--coupang); text-decoration: none; font-weight: 600; }

.qty { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--field); height: 50px; }
.stepper button { width: 46px; height: 48px; font-size: 22px; color: var(--sub); }
.stepper input { width: 44px; text-align: center; border: 0; background: none; font-size: 18px; font-weight: 700; outline: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
  font-size: 14px; color: var(--sub);
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); font-weight: 600; }
.more { margin-top: 14px; font-size: 14px; color: var(--sub); display: flex; align-items: center; gap: 4px; padding: 4px 2px; }
.more svg { transition: transform .15s; }
.more[aria-expanded="true"] svg { transform: rotate(90deg); }
.linkrow { display: flex; gap: 8px; }
.linkrow .field { flex: 1; }
.smallbtn { height: 50px; padding: 0 14px; border-radius: 12px; background: var(--field); border: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
.hint { font-size: 12px; color: var(--faint); margin: 6px 2px 0; }

.primary {
  width: 100%; height: 56px; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
  font-size: 17px; font-weight: 700; margin-top: 18px;
}
.primary:active { filter: brightness(.92); }
.primary:disabled { opacity: .5; }

/* 목록 */
.listhead { display: flex; align-items: center; gap: 8px; margin: 26px 0 10px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  height: 36px; padding: 0 12px; border-radius: 999px; font-size: 14px; color: var(--sub); white-space: nowrap;
  background: transparent; font-weight: 600;
}
.tab b { font-weight: 700; margin-left: 2px; }
.tab[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.sitefilter { height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); font-size: 13px; padding: 0 8px; max-width: 40%; }

.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.item { padding: 14px 14px 12px 16px; position: relative; }
.item.pending { opacity: .6; }
.item .top { display: flex; align-items: flex-start; gap: 10px; }
.item .nm { flex: 1; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; word-break: keep-all; overflow-wrap: anywhere; }
.item .q { font-size: 14px; font-weight: 700; background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 1px 8px; white-space: nowrap; }
.item .meta { font-size: 13px; color: var(--sub); margin-top: 3px; }
.item .memo { font-size: 14px; color: var(--ink); margin-top: 6px; background: var(--field); border-radius: 10px; padding: 7px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.item .acts { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
.cbtn {
  height: 40px; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: 700; color: var(--coupang);
  border: 1px solid color-mix(in srgb, var(--coupang) 35%, transparent); display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
}
.badge { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 7px; }
.badge.요청 { color: var(--req); background: var(--req-bg); }
.badge.주문완료 { color: var(--ord); background: var(--ord-bg); }
.badge.입고완료 { color: var(--done); background: var(--done-bg); }
.next { margin-left: auto; height: 40px; padding: 0 14px; border-radius: 10px; font-size: 14px; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
.item.done .nm { color: var(--sub); text-decoration: line-through; text-decoration-color: var(--faint); }
.newdot { position: absolute; top: 12px; left: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--new); }
.newtag { font-size: 11px; font-weight: 800; color: var(--new); margin-left: 6px; vertical-align: 2px; }
.empty { text-align: center; color: var(--sub); padding: 40px 0; font-size: 15px; }

/* 아래에서 올라오는 창 */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card);
  border-radius: 22px 22px 0 0; padding: 10px 16px calc(20px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.2,1);
  max-width: 560px; margin: 0 auto; max-height: 90vh; overflow-y: auto;
}
.sheet.on { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet h2 { font-size: 19px; margin: 0 0 4px; letter-spacing: -0.02em; }
.sheet .sub { color: var(--sub); font-size: 13px; margin: 0 0 8px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--field); border-radius: 12px; padding: 4px; }
.seg button { height: 42px; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--sub); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.btnrow { display: flex; gap: 8px; margin-top: 18px; }
.sheet .btnrow { position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom)); background: var(--card); padding: 12px 0 calc(20px + env(safe-area-inset-bottom)); margin-bottom: calc(-20px - env(safe-area-inset-bottom)); }
.btnrow .primary { margin: 0; flex: 1; }
.ghost { height: 56px; padding: 0 18px; border-radius: 14px; background: var(--field); font-weight: 600; font-size: 15px; }
.danger { color: var(--danger); }
.linkbtn { display: block; width: 100%; text-align: left; padding: 14px 2px; border-bottom: 1px solid var(--line); font-size: 15px; }
.linkbtn:last-child { border-bottom: 0; }
.linkbtn small { display: block; color: var(--sub); font-size: 12px; margin-top: 2px; }

/* 처음 연결 화면 */
.setup { padding: 22px 18px; margin-top: 20px; }
.setup h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.02em; }
.setup p { color: var(--sub); margin: 0 0 14px; font-size: 15px; }
.setup ol { color: var(--sub); font-size: 14px; padding-left: 20px; margin: 0 0 18px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
  background: var(--ink); color: var(--card); padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 600;
  opacity: 0; transition: all .2s; z-index: 40; max-width: calc(100% - 32px); pointer-events: none; text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.sheet.on ~ .toast { bottom: auto; top: calc(64px + env(safe-area-inset-top)); } /* 아래 창이 열려 있으면 버튼을 가리지 않게 위로 */
[hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>청소용품</h1>
    <span class="sync" id="sync" hidden><i></i><span id="syncText">연결 중</span></span>
    <button class="iconbtn" id="xlsxBtn" aria-label="엑셀로 내보내기" title="엑셀로 내보내기" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    </button>
    <button class="iconbtn" id="menuBtn" aria-label="설정" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
    </button>
  </div>
</header>

<main class="wrap">

  <!-- 처음 연결 -->
  <section class="card setup" id="setupView" hidden>
    <h2>앱 연결하기</h2>
    <p>관리자가 보내준 <b>연결 링크</b>를 휴대폰에서 누르면 바로 연결됩니다.</p>
    <ol>
      <li>구글 시트 메뉴 <b>청소용품 앱 → ② 휴대폰 연결 링크 만들기</b></li>
      <li>나온 링크를 카카오톡으로 보내서 열기</li>
    </ol>
    <div id="setupUrlRow">
      <label class="lbl" for="setupUrl">웹 앱 주소 (직접 넣을 때)</label>
      <input class="field" id="setupUrl" placeholder="https://script.google.com/…/exec" autocomplete="off" inputmode="url">
    </div>
    <div class="row">
      <label class="lbl" for="setupKey">팀 코드</label>
      <input class="field" id="setupKey" autocomplete="off" autocapitalize="off">
    </div>
    <button class="primary" id="setupBtn">연결</button>
  </section>

  <!-- 등록 -->
  <form class="card add" id="addForm" hidden autocomplete="off">
    <label class="lbl" for="fName">필요한 물건</label>
    <input class="field name-field" id="fName" list="dlNames" placeholder="예: 락스 4L, 물티슈" enterkeyhint="done" maxlength="80">
    <div class="cpreview" id="cpreview"></div>

    <div id="addExtra" hidden>
    <div class="row">
      <span class="lbl">수량</span>
      <div class="qty">
        <div class="stepper">
          <button type="button" id="qMinus" aria-label="하나 빼기">−</button>
          <input id="fQty" inputmode="numeric" value="1" aria-label="수량" maxlength="4">
          <button type="button" id="qPlus" aria-label="하나 더하기">+</button>
        </div>
        <div class="chips" id="units"></div>
      </div>
    </div>

    <div class="row">
      <label class="lbl" for="fSite">현장</label>
      <input class="field" id="fSite" list="dlSites" placeholder="예: ○○빌딩 3층" maxlength="40">
    </div>

    <button type="button" class="more" id="moreBtn" aria-expanded="false" aria-controls="moreBox">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      쿠팡 상품 링크 · 메모 (선택)
    </button>
    <div id="moreBox" hidden>
      <div class="row">
        <label class="lbl" for="fLink">쿠팡 상품 링크</label>
        <div class="linkrow">
          <input class="field" id="fLink" placeholder="쿠팡 앱 → 공유 → 링크 복사" inputmode="url">
          <button type="button" class="smallbtn" id="pasteBtn">붙여넣기</button>
        </div>
        <p class="hint">비워두면 품명으로 쿠팡 검색 링크가 자동으로 붙어요.</p>
      </div>
      <div class="row">
        <label class="lbl" for="fMemo">메모</label>
        <textarea class="field" id="fMemo" placeholder="예: 다음 주 월요일까지, 향 없는 걸로" maxlength="300"></textarea>
      </div>
    </div>

    <div class="btnrow">
      <button type="button" class="ghost" id="addCancel">닫기</button>
      <button class="primary" id="addBtn" type="submit">등록하기</button>
    </div>
    </div>
  </form>

  <section id="listView" hidden>
    <div class="listhead">
      <div class="tabs" role="tablist" id="tabs"></div>
      <select class="sitefilter" id="siteFilter" aria-label="현장 고르기" hidden></select>
    </div>
    <ul class="items" id="items"></ul>
    <div class="empty" id="empty" hidden></div>
  </section>
</main>

<datalist id="dlNames"></datalist>
<datalist id="dlSites"></datalist>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // ── 설정 ────────────────────────────────────────────────
  var POLL_MS = 15000;
  var UNITS = ['개', '박스', '통', '롤', '팩', '묶음'];
  var STATUSES = ['요청', '주문완료', '입고완료'];
  var NEXT = { '요청': ['주문완료', '주문했어요'], '주문완료': ['입고완료', '받았어요'] };
  var TABS = [['요청', '요청'], ['주문완료', '주문함'], ['입고완료', '받음'], ['', '전체']];
  var GAS = !!(window.google && google.script && google.script.run);

  // ── 저장소 (사생활 모드 등에서 막혀도 앱은 돈다) ───────────────
  function load(k, d) { try { var v = localStorage.getItem('sup.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem('sup.' + k, JSON.stringify(v)); } catch (e) {} }

  var cfg = load('cfg', null);
  var me = load('me', '');
  var state = {
    items: [], loaded: false, tab: load('tab', '요청'), site: load('siteFilter', ''),
    unit: load('unit', '개'), writes: 0, gen: 0, lastOk: 0, prevIds: null, err: '',
  };

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function coupangSearch(name) { return 'https://www.coupang.com/np/search?q=' + encodeURIComponent(String(name || '').trim()); }
  function extractUrl(t) { var m = String(t || '').match(/https?:\/\/[^\s"'<>]+/); return m ? m[0].replace(/[),.\]]+$/, '') : ''; }
  function cid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  // ── 서버 통신 ──────────────────────────────────────────────
  function call(req) {
    req.k = cfg && cfg.k;
    if (GAS) {
      return new Promise(function (res, rej) {
        google.script.run.withSuccessHandler(function (t) { res(JSON.parse(t)); }).withFailureHandler(rej).api(JSON.stringify(req));
      });
    }
    var p = req.action === 'list'
      ? fetch(cfg.u + '?action=list&k=' + encodeURIComponent(cfg.k) + (req.all ? '&all=1' : '') + '&_=' + Date.now(), { cache: 'no-store' })
      // text/plain 이라 브라우저가 사전 확인(CORS preflight)을 하지 않는다
      : fetch(cfg.u, { method: 'POST', body: JSON.stringify(req) });
    return p.then(function (r) {
      if (!r.ok) throw new Error('서버 응답 ' + r.status);
      return r.json();
    });
  }

  function setSync(kind, text) {
    var s = $('sync'); s.hidden = false;
    s.className = 'sync' + (kind ? ' ' + kind : '');
    $('syncText').textContent = text;
  }
  function syncLabel() {
    if (state.err) return;
    var sec = Math.round((Date.now() - state.lastOk) / 1000);
    setSync('', sec < 20 ? '실시간' : sec < 90 ? sec + '초 전' : Math.round(sec / 60) + '분 전');
  }

  // gen: 쓰기가 끝날 때마다 올린다. 쓰기 전에 출발한 목록 응답은 버린다 (옛 상태로 되돌아가 보이지 않게)
  var polling = false, again = false;
  function refresh(quiet) {
    if (!cfg) return Promise.resolve();
    if (polling) { again = true; return Promise.resolve(); }
    polling = true;
    var gen = state.gen;
    if (!quiet) setSync('busy', '불러오는 중');
    return call({ action: 'list' }).then(function (r) {
      if (!r.ok) throw r;
      state.err = '';
      state.lastOk = Date.now();
      if (state.writes === 0 && gen === state.gen) apply(r.items || []);
      syncLabel();
    }).catch(function (e) {
      state.err = (e && (e.error || e.message)) || '연결 실패';
      setSync('err', '연결 끊김');
      if (e && e.code === 'KEY') { toast('팀 코드가 바뀌었어요. 새 연결 링크로 다시 열어주세요.'); showSetup(); }
      else if (!quiet) toast(state.err);
    }).then(function () {
      polling = false;
      if (again) { again = false; return refresh(true); }
    });
  }

  function apply(items) {
    // 다른 사람이 새로 올린 것 알림
    if (state.prevIds) {
      var fresh = items.filter(function (it) { return !state.prevIds[it.id] && it.by !== me; });
      if (fresh.length) {
        toast(fresh.length === 1 ? (fresh[0].by || '누군가') + '님이 ' + fresh[0].name + ' 요청' : '새 요청 ' + fresh.length + '건');
        if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
      }
    }
    state.prevIds = {};
    items.forEach(function (it) { state.prevIds[it.id] = 1; });
    state.items = items;
    state.loaded = true;
    render();
  }

  // ── 목록 그리기 ────────────────────────────────────────────
  function ago(t) {
    if (!t) return '';
    var d = new Date(t), now = new Date(), s = (now - d) / 1000;
    if (s < 60) return '방금';
    if (s < 3600) return Math.floor(s / 60) + '분 전';
    var hm = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    var day = function (x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
    var diff = Math.round((day(now) - day(d)) / 864e5);
    if (diff === 0) return '오늘 ' + hm;
    if (diff === 1) return '어제 ' + hm;
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
  }

  function render() {
    var all = state.items;
    var sites = {};
    all.forEach(function (it) { if (it.site) sites[it.site] = 1; });
    var siteList = Object.keys(sites).sort();

    var sf = $('siteFilter');
    if (siteList.length >= 2) {
      if (state.site && !sites[state.site]) state.site = '';
      sf.hidden = false;
      sf.innerHTML = '<option value="">현장 전체</option>' + siteList.map(function (s) {
        return '<option' + (s === state.site ? ' selected' : '') + '>' + esc(s) + '</option>';
      }).join('');
    } else { sf.hidden = true; state.site = ''; }

    var inSite = all.filter(function (it) { return !state.site || it.site === state.site; });
    var count = { '': inSite.length };
    STATUSES.forEach(function (s) { count[s] = 0; });
    inSite.forEach(function (it) { count[it.status] = (count[it.status] || 0) + 1; });

    $('tabs').innerHTML = TABS.map(function (t) {
      return '<button class="tab" role="tab" data-tab="' + t[0] + '" aria-selected="' + (state.tab === t[0]) + '">' +
        esc(t[1]) + ' <b>' + (count[t[0]] || 0) + '</b></button>';
    }).join('');

    var shown = inSite.filter(function (it) { return !state.tab || it.status === state.tab; });
    $('items').innerHTML = shown.map(itemHtml).join('');
    var empty = $('empty');
    empty.hidden = shown.length > 0;
    if (!shown.length) {
      empty.textContent = !state.loaded ? '불러오는 중…' :
        state.tab === '요청' ? '지금 필요한 물건이 없어요 👍' :
        state.tab === '주문완료' ? '주문하고 기다리는 물건이 없어요' :
        state.tab === '입고완료' ? '받은 물건이 아직 없어요' : '아직 등록한 물건이 없어요';
    }

    // 자동완성: 예전에 적은 품명·현장
    var names = {};
    all.forEach(function (it) { names[it.name] = 1; });
    $('dlNames').innerHTML = Object.keys(names).slice(0, 200).map(function (n) { return '<option value="' + esc(n) + '">'; }).join('');
    $('dlSites').innerHTML = siteList.map(function (n) { return '<option value="' + esc(n) + '">'; }).join('');
  }

  function itemHtml(it) {
    var fresh = it.by !== me && it.t && Date.now() - it.t < 30 * 60000 && it.status === '요청';
    var meta = [it.site, it.by, ago(it.t)].filter(Boolean).map(esc).join(' · ');
    var next = NEXT[it.status];
    return '<li class="card item' + (it.pending ? ' pending' : '') + (it.status === '입고완료' ? ' done' : '') + '" data-id="' + esc(it.id) + '">' +
      (fresh ? '<span class="newdot"></span>' : '') +
      '<div class="top"><div class="nm">' + esc(it.name) + (fresh ? '<span class="newtag">NEW</span>' : '') + '</div>' +
      (it.qty ? '<span class="q">' + esc(it.qty) + '</span>' : '') + '</div>' +
      '<div class="meta">' + (state.tab ? '' : '<span class="badge ' + esc(it.status) + '">' + esc(it.status) + '</span> ') + meta + '</div>' +
      (it.memo ? '<div class="memo">' + esc(it.memo) + '</div>' : '') +
      '<div class="acts">' +
      '<a class="cbtn" href="' + esc(it.link || coupangSearch(it.name)) + '" target="_blank" rel="noopener">' +
      (it.custom ? '쿠팡 상품' : '쿠팡 검색') +
      ' <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 17L17 7M9 7h8v8"/></svg></a>' +
      (it.pending ? '<span class="meta">저장 중…</span>' :
        next ? '<button class="next" data-next="' + next[0] + '">' + next[1] + '</button>' :
        '<span class="badge 입고완료" style="margin-left:auto">받음</span>') +
      '</div></li>';
  }

  // ── 쓰기 ──────────────────────────────────────────────────
  function write(req, okMsg) {
    state.writes++;
    setSync('busy', '저장 중');
    return call(req).then(function (r) {
      if (!r.ok) throw r;
      return r;
    }).then(function (r) {
      state.writes--; state.gen++;
      if (okMsg) toast(okMsg);
      refresh(true);
      return r;
    }, function (e) {
      state.writes--; state.gen++;
      toast((e && (e.error || e.message)) || '저장 못 했어요. 다시 해주세요.');
      refresh(true);
      throw e;
    });
  }

  function findItem(id) { for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i]; return null; }

  function setStatus(id, status) {
    var it = findItem(id);
    if (!it) return;
    var before = it.status;
    it.status = status;
    render();
    write({ action: 'update', id: id, fields: { status: status } }, status === '주문완료' ? '주문함으로 옮겼어요' : status === '입고완료' ? '받음으로 옮겼어요' : '')
      .catch(function () { it.status = before; render(); });
  }

  // ── 등록 폼 ───────────────────────────────────────────────
  function qtyText() {
    var n = parseInt($('fQty').value, 10);
    if (!(n > 0)) n = 1;
    return n + state.unit;
  }
  function renderUnits() {
    $('units').innerHTML = UNITS.map(function (u) {
      return '<button type="button" class="chip" data-unit="' + u + '" aria-pressed="' + (u === state.unit) + '">' + u + '</button>';
    }).join('');
  }
  function updatePreview() {
    var n = $('fName').value.trim();
    var link = extractUrl($('fLink').value);
    $('cpreview').innerHTML = link
      ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">넣은 쿠팡 상품 링크 확인 ↗</a>'
      : n ? '<a href="' + esc(coupangSearch(n)) + '" target="_blank" rel="noopener">쿠팡에서 \'' + esc(n) + '\' 검색 결과 보기 ↗</a>' : '';
  }

  // 평소엔 품명 칸만 보이고, 누르면 나머지가 펼쳐진다 (목록이 첫 화면에 보이게)
  function expandForm(on) {
    $('addExtra').hidden = !on;
    if (!on) { $('fName').value = ''; $('fLink').value = ''; $('fMemo').value = ''; $('fQty').value = '1'; updatePreview(); $('fName').blur(); }
  }

  function submit(ev) {
    ev.preventDefault();
    var name = $('fName').value.trim();
    if (!name) { $('fName').focus(); toast('필요한 물건을 적어주세요'); return; }
    var rawLink = $('fLink').value.trim();
    var link = extractUrl(rawLink);
    if (rawLink && !link) { toast('링크는 https:// 로 시작해야 해요'); $('fLink').focus(); return; }
    var site = $('fSite').value.trim();
    var req = { action: 'add', cid: cid(), name: name, qty: qtyText(), site: site, by: me, memo: $('fMemo').value.trim(), link: link };
    save('site', site);

    var temp = { id: req.cid, t: Date.now(), site: site, name: name, qty: req.qty, by: me, memo: req.memo, status: '요청',
      link: link || coupangSearch(name), custom: !!link, pending: true };
    state.items.unshift(temp);
    if (state.tab !== '요청' && state.tab !== '') state.tab = '요청';
    render();

    var keep = { name: name, qty: $('fQty').value, link: rawLink, memo: req.memo };
    expandForm(false);

    write(req, '등록했어요 · 시트에 올라갔어요').catch(function () {
      state.items = state.items.filter(function (x) { return x !== temp; });
      render();
      expandForm(true);
      $('fName').value = keep.name; $('fQty').value = keep.qty; $('fLink').value = keep.link; $('fMemo').value = keep.memo;
      updatePreview();
    });
  }

  // ── 아래 창 ───────────────────────────────────────────────
  function openSheet(html, onMount) {
    $('sheetBody').innerHTML = html;
    $('scrim').classList.add('on');
    $('sheet').classList.add('on');
    if (onMount) onMount($('sheetBody'));
  }
  function closeSheet() { $('scrim').classList.remove('on'); $('sheet').classList.remove('on'); }

  function editItem(id) {
    var it = findItem(id);
    if (!it || it.pending) return;
    var cur = it.status;
    openSheet(
      '<h2>' + esc(it.name) + '</h2><p class="sub">' + esc([it.site, it.by, ago(it.t)].filter(Boolean).join(' · ')) + '</p>' +
      '<div class="seg" id="eSeg">' + STATUSES.map(function (s) { return '<button type="button" data-s="' + s + '" aria-pressed="' + (s === cur) + '">' + s + '</button>'; }).join('') + '</div>' +
      '<div class="row"><label class="lbl" for="eName">품명</label><input class="field" id="eName" maxlength="80" value="' + esc(it.name) + '"></div>' +
      '<div class="row"><label class="lbl" for="eQty">수량</label><input class="field" id="eQty" maxlength="20" value="' + esc(it.qty) + '"></div>' +
      '<div class="row"><label class="lbl" for="eSite">현장</label><input class="field" id="eSite" list="dlSites" maxlength="40" value="' + esc(it.site) + '"></div>' +
      '<div class="row"><label class="lbl" for="eLink">쿠팡 상품 링크</label><input class="field" id="eLink" inputmode="url" placeholder="비우면 검색 링크" value="' + esc(it.custom ? it.link : '') + '"></div>' +
      '<div class="row"><label class="lbl" for="eMemo">메모</label><textarea class="field" id="eMemo" maxlength="300">' + esc(it.memo) + '</textarea></div>' +
      '<div class="btnrow"><button type="button" class="ghost danger" id="eDel">삭제</button><button type="button" class="primary" id="eSave">저장</button></div>',
      function (root) {
        root.querySelector('#eSeg').addEventListener('click', function (e) {
          var b = e.target.closest('button'); if (!b) return;
          cur = b.getAttribute('data-s');
          root.querySelectorAll('#eSeg button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
        });
        root.querySelector('#eDel').addEventListener('click', function () {
          if (!confirm('"' + it.name + '" 을(를) 지울까요? 시트에서도 지워집니다.')) return;
          closeSheet();
          var before = state.items.slice();
          state.items = state.items.filter(function (x) { return x.id !== id; });
          render();
          write({ action: 'remove', id: id }, '지웠어요').catch(function () { state.items = before; render(); });
        });
        root.querySelector('#eSave').addEventListener('click', function () {
          var f = {};
          var v = function (sel) { return root.querySelector(sel).value.trim(); };
          if (!v('#eName')) { toast('품명을 적어주세요'); return; }
          var rawLink = v('#eLink'), link = extractUrl(rawLink);
          if (rawLink && !link) { toast('링크는 https:// 로 시작해야 해요'); return; }
          if (cur !== it.status) f.status = cur;
          if (v('#eName') !== it.name) f.name = v('#eName');
          if (v('#eQty') !== it.qty) f.qty = v('#eQty');
          if (v('#eSite') !== it.site) f.site = v('#eSite');
          if (v('#eMemo') !== it.memo) f.memo = v('#eMemo');
          if (link !== (it.custom ? it.link : '')) f.link = link;
          closeSheet();
          if (!Object.keys(f).length) return;
          var before = JSON.parse(JSON.stringify(it));
          if (f.status) it.status = f.status;
          ['name', 'qty', 'site', 'memo'].forEach(function (k) { if (f[k] !== undefined) it[k] = f[k]; });
          if (f.link !== undefined || f.name !== undefined) {
            var l = f.link !== undefined ? f.link : (it.custom ? it.link : '');
            it.custom = !!l; it.link = l || coupangSearch(it.name);
          }
          render();
          write({ action: 'update', id: id, fields: f }, '고쳤어요').catch(function () { Object.assign(it, before); render(); });
        });
      });
  }

  // ── 엑셀 내보내기 ──────────────────────────────────────────
  // 라이브러리 없이 .xlsx 를 직접 만든다 (zip 무압축 + XML). 카톡 앱 안 브라우저 등에서 외부 스크립트가 막혀도 되게.
  var CRC_T = (function () {
    var t = [], c, n, k;
    for (n = 0; n < 256; n++) { c = n; for (k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  function crc32(b) { var c = 0xffffffff; for (var i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }

  function zip(files) { // files: [{name, data: string}]
    var enc = new TextEncoder(), parts = [], central = [], off = 0;
    var d = new Date();
    var dosT = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    var dosD = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    function hdr(size) { var b = new Uint8Array(size); return { b: b, v: new DataView(b.buffer) }; }
    files.forEach(function (f) {
      var name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
      var L = hdr(30), v = L.v;
      v.setUint32(0, 0x04034b50, true); v.setUint16(4, 20, true); v.setUint16(6, 0x0800, true); v.setUint16(8, 0, true);
      v.setUint16(10, dosT, true); v.setUint16(12, dosD, true); v.setUint32(14, crc, true);
      v.setUint32(18, data.length, true); v.setUint32(22, data.length, true); v.setUint16(26, name.length, true); v.setUint16(28, 0, true);
      var C = hdr(46), w = C.v;
      w.setUint32(0, 0x02014b50, true); w.setUint16(4, 20, true); w.setUint16(6, 20, true); w.setUint16(8, 0x0800, true); w.setUint16(10, 0, true);
      w.setUint16(12, dosT, true); w.setUint16(14, dosD, true); w.setUint32(16, crc, true);
      w.setUint32(20, data.length, true); w.setUint32(24, data.length, true); w.setUint16(28, name.length, true);
      w.setUint32(42, off, true);
      parts.push(L.b, name, data); central.push(C.b, name);
      off += 30 + name.length + data.length;
    });
    var csize = central.reduce(function (n, b) { return n + b.length; }, 0);
    var E = hdr(22), e = E.v;
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, csize, true); e.setUint32(16, off, true);
    return new Blob(parts.concat(central, [E.b]), { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  function xesc(s) { return String(s == null ? '' : s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function colName(i) { return String.fromCharCode(65 + i); }

  // rows: 표 머리 다음의 데이터. 열마다 {head, width, get(it) → {s|n|d|link}}
  function buildXlsx(items, title) {
    var COLS = [
      { h: '등록일시', w: 17, v: function (it) { return { d: it.t }; } },
      { h: '현장', w: 22, v: function (it) { return { s: it.site }; } },
      { h: '품명', w: 28, v: function (it) { return { s: it.name }; } },
      { h: '수량', w: 9, v: function (it) { return { s: it.qty }; } },
      { h: '상태', w: 10, v: function (it) { return { s: it.status }; } },
      { h: '등록자', w: 10, v: function (it) { return { s: it.by }; } },
      { h: '메모', w: 36, v: function (it) { return { s: it.memo }; } },
      { h: '쿠팡', w: 13, v: function (it) { return { link: it.link || coupangSearch(it.name), label: it.custom ? '쿠팡 상품' : '쿠팡에서 찾기' }; } },
    ];
    var last = colName(COLS.length - 1), n = items.length + 1;
    function cell(ref, x) {
      if (x.d) { // 엑셀 날짜 일련번호 (이 휴대폰 시간대 기준)
        // 초 단위로 반올림해야 09:05 가 09:04:59.98 → '09:04' 로 보이지 않는다
        var local = Math.round((x.d - new Date(x.d).getTimezoneOffset() * 60000) / 1000);
        return '<c r="' + ref + '" s="2"><v>' + (local / 86400 + 25569) + '</v></c>';
      }
      if (x.link) {
        var q = function (s) { return xesc(String(s).replace(/"/g, '""')); };
        return '<c r="' + ref + '" s="3" t="str"><f>HYPERLINK("' + q(x.link) + '","' + q(x.label) + '")</f><v>' + xesc(x.label) + '</v></c>';
      }
      if (!x.s) return '';
      return '<c r="' + ref + '" s="4" t="inlineStr"><is><t xml:space="preserve">' + xesc(x.s) + '</t></is></c>';
    }
    var rows = ['<row r="1">' + COLS.map(function (c, i) {
      return '<c r="' + colName(i) + '1" s="1" t="inlineStr"><is><t>' + xesc(c.h) + '</t></is></c>';
    }).join('') + '</row>'];
    items.forEach(function (it, k) {
      var r = k + 2;
      rows.push('<row r="' + r + '">' + COLS.map(function (c, i) { return cell(colName(i) + r, c.v(it)); }).join('') + '</row>');
    });
    var sheetName = xesc(title);
    var sheet = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<dimension ref="A1:' + last + n + '"/>' +
      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>' +
      '<sheetFormatPr defaultRowHeight="18"/>' +
      '<cols>' + COLS.map(function (c, i) { return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + c.w + '" customWidth="1"/>'; }).join('') + '</cols>' +
      '<sheetData>' + rows.join('') + '</sheetData>' +
      '<autoFilter ref="A1:' + last + n + '"/>' +
      '</worksheet>';
    var styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<numFmts count="1"><numFmt numFmtId="164" formatCode="yyyy-mm-dd hh:mm"/></numFmts>' +
      '<fonts count="3"><font><sz val="11"/><name val="맑은 고딕"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="맑은 고딕"/></font>' +
      '<font><u/><sz val="11"/><color rgb="FFE52528"/><name val="맑은 고딕"/></font></fonts>' +
      '<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>' +
      '<fill><patternFill patternType="solid"><fgColor rgb="FF1F2937"/><bgColor indexed="64"/></patternFill></fill></fills>' +
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="5">' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment vertical="top"/></xf>' +
      '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1" applyAlignment="1"><alignment vertical="top"/></xf>' +
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf>' +
      '</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
    return zip([
      { name: '[Content_Types].xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
        '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
        '</Types>' },
      { name: '_rels/.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
        '</Relationships>' },
      { name: 'xl/workbook.xml', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
        '<sheets><sheet name="' + sheetName + '" sheetId="1" r:id="rId1"/></sheets>' +
        '<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">\'' + sheetName + '\'!$A$1:$' + last + '$' + n + '</definedName></definedNames>' +
        '</workbook>' },
      { name: 'xl/_rels/workbook.xml.rels', data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
        '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
        '</Relationships>' },
      { name: 'xl/worksheets/sheet1.xml', data: sheet },
      { name: 'xl/styles.xml', data: styles },
    ]);
  }

  function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }

  // 기간: [시작, 끝) 밀리초
  function periodRange(key) {
    var d = new Date(), y = d.getFullYear(), m = d.getMonth();
    if (key === 'this') return [new Date(y, m, 1).getTime(), new Date(y, m + 1, 1).getTime()];
    if (key === 'last') return [new Date(y, m - 1, 1).getTime(), new Date(y, m, 1).getTime()];
    return [0, Infinity];
  }

  function saveFile(blob, filename) {
    var file;
    try { file = new File([blob], filename, { type: blob.type }); } catch (e) {}
    var mobile = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    // 휴대폰: 공유 창(파일에 저장 / 카톡으로 보내기)이 다운로드보다 잘 된다
    if (mobile && file && navigator.canShare && navigator.canShare({ files: [file] })) {
      return navigator.share({ files: [file], title: filename }).catch(function (e) {
        if (e && e.name === 'AbortError') return;
        download(blob, filename);
      });
    }
    download(blob, filename);
    return Promise.resolve();
  }
  function download(blob, filename) {
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }

  function openExport() {
    var opt = { period: 'this', status: '', site: state.site };
    var all = null;
    var sites = {};
    state.items.forEach(function (it) { if (it.site) sites[it.site] = 1; });
    var PER = [['this', '이번 달'], ['last', '지난 달'], ['all', '전체']];
    var STS = [['', '전체'], ['요청', '요청'], ['주문완료', '주문함'], ['입고완료', '받음']];
    function seg(id, list, cur) {
      return '<div class="seg" id="' + id + '" style="grid-template-columns:repeat(' + list.length + ',1fr)">' + list.map(function (p) {
        return '<button type="button" data-v="' + p[0] + '" aria-pressed="' + (p[0] === cur) + '">' + p[1] + '</button>';
      }).join('') + '</div>';
    }
    openSheet(
      '<h2>엑셀로 내보내기</h2><p class="sub">등록일시 기준으로 고른 것만 .xlsx 파일로 받아요.</p>' +
      '<div class="row"><span class="lbl">기간</span>' + seg('xPer', PER, opt.period) + '</div>' +
      '<div class="row"><span class="lbl">상태</span>' + seg('xSt', STS, opt.status) + '</div>' +
      '<div class="row"><label class="lbl" for="xSite">현장</label><select class="field" id="xSite"><option value="">현장 전체</option>' +
      Object.keys(sites).sort().map(function (s) { return '<option' + (s === opt.site ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="btnrow"><button type="button" class="ghost" id="xCancel">닫기</button><button type="button" class="primary" id="xGo" disabled>불러오는 중…</button></div>',
      function (root) {
        var go = root.querySelector('#xGo');
        function pick() {
          var r = periodRange(opt.period);
          return (all || []).filter(function (it) {
            return (!opt.status || it.status === opt.status) && (!opt.site || it.site === opt.site) && (it.t || 0) >= r[0] && (it.t || 0) < r[1];
          }).sort(function (a, b) { return (a.t || 0) - (b.t || 0); }); // 엑셀은 오래된 것부터
        }
        function update() {
          if (!all) return;
          var n = pick().length;
          go.disabled = n === 0;
          go.textContent = n ? '엑셀 파일 받기 (' + n + '건)' : '해당하는 기록이 없어요';
        }
        function bindSeg(id, key) {
          root.querySelector('#' + id).addEventListener('click', function (e) {
            var b = e.target.closest('button'); if (!b) return;
            opt[key] = b.getAttribute('data-v');
            root.querySelectorAll('#' + id + ' button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
            update();
          });
        }
        bindSeg('xPer', 'period'); bindSeg('xSt', 'status');
        root.querySelector('#xSite').onchange = function () { opt.site = this.value; update(); };
        root.querySelector('#xCancel').onclick = closeSheet;
        go.onclick = function () {
          var rows = pick();
          if (!rows.length) return;
          var d = new Date();
          var label = opt.period === 'this' ? (d.getMonth() + 1) + '월' : opt.period === 'last' ? (new Date(d.getFullYear(), d.getMonth() - 1, 1).getMonth() + 1) + '월' : '전체';
          var name = ['청소용품', label, opt.site, opt.status, ymd(d)].filter(Boolean).join('_').replace(/[\\/:*?"<>|]/g, '') + '.xlsx';
          saveFile(buildXlsx(rows, '청소용품'), name).then(function () { toast('엑셀 파일을 만들었어요'); });
        };
        // 오래된 입고완료까지 포함한 전체 목록을 따로 받아 온다
        call({ action: 'list', all: 1 }).then(function (r) {
          if (!r.ok) throw r;
          all = r.items || [];
          update();
        }).catch(function (e) {
          go.textContent = '불러오지 못했어요';
          toast((e && (e.error || e.message)) || '연결 실패');
        });
      });
  }

  function shareLink() {
    var c = btoa(JSON.stringify({ u: cfg.u || '', k: cfg.k })).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    if (GAS) return null; // Apps Script 화면 안에서는 주소를 알 수 없다 → 시트 메뉴에서 만든다
    return location.origin + location.pathname + '#c=' + c;
  }

  function openMenu() {
    var link = shareLink();
    openSheet(
      '<h2>설정</h2>' +
      '<button class="linkbtn" id="mName">내 이름<small>' + esc(me || '(없음)') + ' — 등록자로 표시돼요</small></button>' +
      (link ? '<button class="linkbtn" id="mShare">함께 볼 사람에게 링크 보내기<small>카카오톡으로 보내면 그 휴대폰도 바로 연결돼요</small></button>' : '') +
      '<button class="linkbtn" id="mXlsx">엑셀로 내보내기<small>기간·상태·현장을 골라 .xlsx 파일로 받아요</small></button>' +
      '<button class="linkbtn" id="mRefresh">지금 새로고침<small>' + esc(state.err ? '오류: ' + state.err : '15초마다 자동으로 새로고침돼요') + '</small></button>' +
      '<button class="linkbtn danger" id="mReset">연결 끊기<small>이 휴대폰에서만 연결 정보를 지워요</small></button>',
      function (root) {
        root.querySelector('#mName').onclick = function () { closeSheet(); askName(true); };
        if (link) root.querySelector('#mShare').onclick = function () {
          var text = '청소용품 요청 앱 — 이 링크를 열면 바로 연결돼요';
          if (navigator.share) navigator.share({ title: '청소용품', text: text, url: link }).catch(function () {});
          else copy(link).then(function () { toast('링크를 복사했어요. 카카오톡에 붙여넣으세요'); });
        };
        root.querySelector('#mXlsx').onclick = openExport;
        root.querySelector('#mRefresh').onclick = function () { closeSheet(); refresh(false); };
        root.querySelector('#mReset').onclick = function () {
          if (!confirm('이 휴대폰의 연결을 끊을까요?')) return;
          save('cfg', null); cfg = null; closeSheet(); showSetup();
        };
      });
  }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(t);
    return Promise.resolve();
  }

  function askName(force) {
    if (me && !force) return;
    openSheet(
      '<h2>이름을 알려주세요</h2><p class="sub">등록한 사람으로 표시돼요. 나중에 설정에서 바꿀 수 있어요.</p>' +
      '<input class="field" id="nmIn" maxlength="20" placeholder="예: 홍길동" value="' + esc(me) + '">' +
      '<div class="btnrow"><button type="button" class="primary" id="nmOk">확인</button></div>',
      function (root) {
        var inp = root.querySelector('#nmIn');
        var ok = function () {
          var v = inp.value.trim();
          if (!v) { inp.focus(); return; }
          me = v; save('me', me); closeSheet(); render();
        };
        root.querySelector('#nmOk').onclick = ok;
        inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') ok(); });
        setTimeout(function () { inp.focus(); }, 250);
      });
  }

  // ── 화면 전환 ─────────────────────────────────────────────
  function showSetup() {
    $('setupView').hidden = false;
    $('addForm').hidden = true; $('listView').hidden = true; $('menuBtn').hidden = true; $('xlsxBtn').hidden = true; $('sync').hidden = true;
    $('setupUrlRow').hidden = GAS;
    if (cfg) { $('setupUrl').value = cfg.u || ''; $('setupKey').value = ''; }
  }
  function showApp() {
    $('setupView').hidden = true;
    $('addForm').hidden = false; $('listView').hidden = false; $('menuBtn').hidden = false; $('xlsxBtn').hidden = false;
    $('fSite').value = load('site', '');
    renderUnits(); render();
    refresh(false);
    askName(false);
  }

  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2600);
  }

  function decodeCfg(c) {
    try {
      var s = atob(String(c).replace(/-/g, '+').replace(/_/g, '/'));
      var o = JSON.parse(decodeURIComponent(escape(s)));
      if (o && o.k) return { u: o.u || '', k: String(o.k) };
    } catch (e) {}
    return null;
  }

  // ── 이벤트 ───────────────────────────────────────────────
  $('addForm').addEventListener('submit', submit);
  $('fName').addEventListener('input', function () { updatePreview(); expandForm(true); });
  $('fName').addEventListener('focus', function () { expandForm(true); });
  $('addCancel').onclick = function () { expandForm(false); };
  $('fLink').addEventListener('input', updatePreview);
  $('qMinus').onclick = function () { $('fQty').value = Math.max(1, (parseInt($('fQty').value, 10) || 1) - 1); };
  $('qPlus').onclick = function () { $('fQty').value = Math.min(999, (parseInt($('fQty').value, 10) || 0) + 1); };
  $('units').addEventListener('click', function (e) {
    var b = e.target.closest('[data-unit]'); if (!b) return;
    state.unit = b.getAttribute('data-unit'); save('unit', state.unit); renderUnits();
  });
  $('moreBtn').onclick = function () {
    var open = $('moreBox').hidden;
    $('moreBox').hidden = !open; this.setAttribute('aria-expanded', open);
  };
  $('pasteBtn').onclick = function () {
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (t) {
        var u = extractUrl(t);
        if (u) { $('fLink').value = u; updatePreview(); } else toast('복사한 내용에 링크가 없어요');
      }).catch(function () { $('fLink').focus(); toast('칸을 길게 눌러 붙여넣어 주세요'); });
    } else { $('fLink').focus(); toast('칸을 길게 눌러 붙여넣어 주세요'); }
  };
  $('fLink').addEventListener('blur', function () { var u = extractUrl(this.value); if (u) this.value = u; updatePreview(); });

  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]'); if (!b) return;
    state.tab = b.getAttribute('data-tab'); save('tab', state.tab); render();
  });
  $('siteFilter').onchange = function () { state.site = this.value; save('siteFilter', state.site); render(); };
  $('items').addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    var li = e.target.closest('.item'); if (!li) return;
    var nb = e.target.closest('[data-next]');
    if (nb) setStatus(li.getAttribute('data-id'), nb.getAttribute('data-next'));
    else editItem(li.getAttribute('data-id'));
  });
  $('scrim').onclick = closeSheet;
  $('menuBtn').onclick = openMenu;
  $('xlsxBtn').onclick = openExport;
  $('setupBtn').onclick = function () {
    var u = $('setupUrl').value.trim(), k = $('setupKey').value.trim();
    var fromLink = decodeCfg((u.match(/[#?&]c=([^&]+)/) || [])[1] || '');
    if (fromLink) { u = fromLink.u; k = fromLink.k; }
    if (!GAS && !/^https:\/\/script\.google(usercontent)?\.com\//.test(u) && !/^http:\/\/localhost/.test(u)) { toast('웹 앱 주소를 확인해 주세요 (…/exec)'); return; }
    if (!k) { toast('팀 코드를 넣어주세요'); return; }
    cfg = { u: GAS ? '' : u, k: k }; save('cfg', cfg); showApp();
  };

  setInterval(function () {
    if (!cfg || document.hidden) return;
    if (Date.now() - state.lastOk >= POLL_MS - 500) refresh(true); else syncLabel();
  }, 5000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && cfg) refresh(true); });
  setInterval(function () { if (!document.hidden && state.loaded && state.writes === 0) render(); }, 60000); // "n분 전" 갱신

  // ── 시작 ─────────────────────────────────────────────────
  function start(param) {
    var c = decodeCfg(param || '');
    if (c) { cfg = { u: GAS ? '' : c.u, k: c.k }; save('cfg', cfg); toast('연결됐어요'); }
    if (cfg && cfg.k && (GAS || cfg.u)) showApp(); else showSetup();
  }
  if (GAS && google.script.url) {
    google.script.url.getLocation(function (loc) { start((loc.parameter && loc.parameter.c) || ''); });
  } else {
    var m = (location.hash + '&' + location.search).match(/[#?&]c=([^&]+)/);
    if (m) history.replaceState(null, '', location.pathname);
    start(m ? m[1] : '');
  }
})();
</script>
</body>
</html>
